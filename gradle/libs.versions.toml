# ==================== 版本目录 ====================
# 集中管理所有依赖的版本号，app/build.gradle.kts 通过 libs.xxx 引用

[versions]
agp = "9.3.1"                 # Android Gradle Plugin 版本
kotlin = "2.3.21"              # Kotlin 版本
junit = "4.13.2"               # JUnit 4（单元测试）
junitVersion = "1.3.0"         # AndroidX JUnit 扩展
espressoCore = "3.7.0"         # Espresso UI 测试
appcompat = "1.7.1"            # AndroidX AppCompat
material = "1.14.0"            # Material Components
activity = "1.13.0"            # AndroidX Activity
constraintlayout = "2.2.1"     # ConstraintLayout
shizuku = "13.1.5"             # Shizuku（免 root 提权执行 shell 命令）
coroutines = "1.11.0"          # Kotlin 协程
mlkit = "16.0.1"               # ML Kit 文字识别（中文 OCR）

[libraries]
# ---- 测试相关 ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# ---- UI 基础库 ----
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# ---- Shizuku（用于授予写入安全设置权限/截图）----
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
# ---- 协程 ----
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# ---- OCR：ML Kit 中文文字识别（模型随 APK 打包）----
mlkit-text-recognition-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkit" }

# ==================== 插件 ====================
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" } # Android 应用插件
