# Gradle 守护进程的 JVM 参数：2GB 堆内存，文件编码固定为 UTF-8（保证中文注释/资源不乱码）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 使用 AndroidX 支持库
android.useAndroidX=true
# 开启非传递性 R 类（每个模块只包含自己的资源 ID，加快编译）
android.nonTransitiveRClass=true
# 允许使用高于当前 AGP 官方支持的 compileSdk 版本（本项目使用 compileSdk 37）
android.suppressUnsupportedCompileSdk=37.0
# AGP 9：关闭包名唯一性强制（单模块项目不需要）
android.uniquePackageNames=false
# AGP 9：保持旧的 R8 keep 规则行为，避免混淆规则失效
android.r8.strictFullModeForKeepRules=false
# 后端服务地址（统计上报 / 录制脚本备份 / 聊天室三者共用），换服务器只改这一行。
# 构建时经 BuildConfig.SERVER_BASE_URL 注入代码，Kotlin 侧不再硬编码域名。
autoslide.serverBaseUrl=https://pve.8450696.shop
